<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.2/css/bulma.min.css">
    <style>
        body {
            display: grid;
            place-items: center;
            height: 100vh;
        }

        form {
            width: 300px;
            text-align: center;
        }
    </style>
</head>

<body>
    <form id="loginForm">
        <h1 class="title">Login</h1>

        <div class="field">
            <input type="text" class="input" placeholder="Username" required name="username">
        </div>

        <div class="field">
            <input type="password" class="input" placeholder="Password" required name="password">
        </div>

        <button type="submit" class="button is-fullwidth is-primary">Login</button>
        <p id="loginMessage" style="margin-top: 1rem; color: red;"></p>
    </form>

    <script>
        const form = document.getElementById('loginForm');
        const message = document.getElementById('loginMessage');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.textContent = '';

            const formData = new FormData(form);
            const payload = {
                username: formData.get('username'),
                password: formData.get('password')
            };

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    message.textContent = data.message || 'Login failed';
                    return;
                }

                window.location.href = data.redirect || '/map.html';
            } catch (error) {
                message.textContent = 'Login request failed';
            }
        });
    </script>
</body>

</html>
